excludes = [
  ".direnv",
  "result",
  # generated / vendored
  "machines/grouse/hardware-configuration.nix",
  "machines/grouse/apple-silicon-support/**",
]

[formatter.alejandra]
command = "alejandra"
includes = ["*.nix"]

[formatter.stylua]
command = "stylua"
includes = ["*.lua"]

[formatter.shfmt]
command = "shfmt"
options = ["-w", "-i", "4"]
includes = ["*.sh"]
