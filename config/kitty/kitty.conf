# Kitty Configuration
# Based on wezterm config

# Font Configuration
font_family      Monaspace Neon Medium
font_size        11.0

# Disable ligatures (equivalent to harfbuzz_features in wezterm)
disable_ligatures always

# Window appearance
background_opacity 0.8
background_blur 30

# Hide title bar but keep window controls (closest to wezterm's TITLE decoration)
hide_window_decorations titlebar-only

# Disable close confirmation
confirm_os_window_close 0

# Color scheme - Material Darker (dark mode)
# You can switch to the light theme below by commenting this out
include material-darker.conf

# Uncomment for light mode (iTerm2 Light Background equivalent)
# include iterm2-light.conf

# Tab bar configuration (similar to tabline plugin in wezterm)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# Key bindings
# CMD+Left Arrow - go to beginning of line (Home)
map cmd+left send_text all \x1b[H

# CMD+Right Arrow - go to end of line (End)
map cmd+right send_text all \x1b[F

# CMD+, - Open kitty config in nvim
map cmd+comma launch --type=tab nvim ~/.config/kitty/kitty.conf

# macOS specific settings
macos_quit_when_last_window_closed no
macos_option_as_alt yes

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes
