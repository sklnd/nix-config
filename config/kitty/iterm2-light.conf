# iTerm2 Light Background Color Scheme
# Based on the iTerm2 Light Background theme from wezterm

# The basic colors
foreground              #000000
background              #FFFFFF
selection_foreground    #000000
selection_background    #B5D5FF

# Cursor colors
cursor                  #000000
cursor_text_color       #FFFFFF

# URL underline color when hovering with mouse
url_color               #0000EE

# kitty window border colors
